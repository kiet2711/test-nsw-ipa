name: Build Game IPA

on:
  workflow_dispatch:
    inputs:
      game_download_url:
        description: 'Link tải Game (Thư mục Google Drive chứa Base/Update/DLC/Mod, hoặc link file ROM/ZIP)'
        required: true
        type: string
        default: 'https://drive.google.com/file/d/1D527vQTykL4WggIbWdGEbttQlxyR2Ua5/view?usp=sharing'
      update_download_url:
        description: 'Link tải Update (Tùy chọn: chỉ nhập nếu không dùng thư mục gộp)'
        required: false
        type: string
        default: ''
      dlc_download_url:
        description: 'Link tải DLC (Tùy chọn: chỉ nhập nếu không dùng thư mục gộp)'
        required: false
        type: string
        default: ''
      mod_download_url:
        description: 'Link tải Mod/Việt hóa (Tùy chọn: chỉ nhập nếu không dùng thư mục gộp)'
        required: false
        type: string
        default: ''

env:
  DEFAULT_URL: 'https://drive.google.com/file/d/1D527vQTykL4WggIbWdGEbttQlxyR2Ua5/view?usp=sharing'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cài đặt công cụ hệ thống & thư viện
        run: |
          command -v xcodegen || brew install xcodegen
          brew install zstd spirv-cross glslang sevenzip || true
          command -v dotnet || brew install --cask dotnet-sdk || true
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Thiết lập biến môi trường .NET
        run: |
          DOTNET_BIN=$(which dotnet)
          REAL_DOTNET=$(python3 -c "import os, sys; print(os.path.dirname(os.path.realpath(sys.argv[1])))" "$DOTNET_BIN")
          echo "Tìm thấy .NET tại: $REAL_DOTNET"
          echo "DOTNET_ROOT=$REAL_DOTNET" >> $GITHUB_ENV
          echo "DOTNET_ROOT_ARM64=$REAL_DOTNET" >> $GITHUB_ENV
          sudo mkdir -p /etc/dotnet
          echo "$REAL_DOTNET" | sudo tee /etc/dotnet/install_location_arm64 /etc/dotnet/install_location

      - name: Kiểm tra file prod.keys
        run: |
          if [ ! -f game/prod.keys ]; then
            echo "::error::Không tìm thấy file game/prod.keys trong repository!"
            exit 1
          fi
          echo "Đã tìm thấy game/prod.keys (kích thước: $(wc -c < game/prod.keys) bytes)"

      - name: Tải file game, update, DLC và Mod về runner
        run: |
          mkdir -p game

          # Hàm tải file/folder dùng chung (hỗ trợ Google Drive File/Folder & Direct URL)
          download_asset() {
            local url="$1"
            local desc="$2"

            if [ -z "$url" ]; then
              return 0
            fi

            echo "===================================================="
            echo "Bắt đầu tải $desc từ: $url"
            if [[ "$url" == *"drive.google.com"* ]]; then
              if [[ "$url" == *"/folders/"* ]]; then
                echo "Phát hiện link Thư mục Google Drive (Folder). Đang tải toàn bộ thư mục qua gdown..."
                python3 -m gdown --folder "$url" -O game/
              else
                echo "Phát hiện link File Google Drive. Đang tải qua gdown..."
                python3 -m gdown "$url" -O game/
              fi
            else
              echo "Đang tải qua curl..."
              curl -L -O -J --output-dir game "$url"
            fi
          }

          # Tải Game gốc / Thư mục tổng hợp
          download_asset "${{ inputs.game_download_url || env.DEFAULT_URL }}" "Game / Thư mục dữ liệu"

          # Tải Update riêng (nếu có nhập link riêng)
          download_asset "${{ inputs.update_download_url }}" "Update"

          # Tải DLC riêng (nếu có nhập link riêng)
          download_asset "${{ inputs.dlc_download_url }}" "DLC"

          # Xử lý đồng bộ cấu trúc nếu gdown tải về dạng thư mục con bên trong game/
          echo "----------------------------------------------------"
          echo "Đồng bộ cấu trúc thư mục sau khi tải..."

          # Nếu có thư mục romfs bên trong thư mục con do Google Drive tạo ra, đưa về game/romfs/
          FOUND_SUB_ROMFS=$(find game -mindepth 2 -type d -iname "romfs" | head -n 1)
          if [ -n "$FOUND_SUB_ROMFS" ]; then
            echo "Phát hiện thư mục romfs bên trong thư mục con: $FOUND_SUB_ROMFS. Đang đưa về game/romfs/..."
            mkdir -p game/romfs
            cp -R "$FOUND_SUB_ROMFS"/* game/romfs/
            rm -rf "$FOUND_SUB_ROMFS"
          fi

          # Di chuyển tất cả file từ các thư mục con (ngoại trừ romfs và extracted_temp) ra thẳng thư mục gốc game/
          find game -mindepth 2 -not -path "game/romfs*" -not -path "game/extracted_temp*" -type f -exec mv -v {} game/ \; 2>/dev/null || true
          # Dọn dẹp các thư mục con rỗng
          find game -mindepth 1 -not -path "game/romfs*" -not -path "game/extracted_temp*" -type d -empty -delete 2>/dev/null || true

          # Kiểm tra và phân loại các file nén trong thư mục game/ (.zip, .7z, .rar, .tar.gz)
          echo "----------------------------------------------------"
          echo "Kiểm tra và phân loại các file nén trong thư mục game/..."
          mkdir -p game/extracted_temp
          for archive in game/*.zip game/*.7z game/*.rar game/*.tar.gz; do
            if [ -f "$archive" ]; then
              echo "Phát hiện file nén: $(basename "$archive"). Đang tiến hành phân tích..."
              mkdir -p game/extracted_temp/current
              if [[ "$archive" == *.zip ]]; then
                unzip -q -o "$archive" -d game/extracted_temp/current/
              elif command -v 7z >/dev/null 2>&1; then
                7z x -y "$archive" -ogame/extracted_temp/current/
              elif command -v 7za >/dev/null 2>&1; then
                7za x -y "$archive" -ogame/extracted_temp/current/
              else
                echo "::warning::Không tìm thấy công cụ giải nén phù hợp cho $archive"
              fi

              # 1. Kiểm tra xem file nén có chứa ROM (.nsp, .xci, .nsz, .xcz) hay không
              FOUND_ROMS=$(find game/extracted_temp/current -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \))
              if [ -n "$FOUND_ROMS" ]; then
                echo "  -> Tìm thấy file ROM trong $(basename "$archive"). Đang chuyển ra game/..."
                find game/extracted_temp/current -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \) -exec mv -v {} game/ \;
              fi

              # 2. Kiểm tra xem file nén có chứa Mod / Việt hóa (thư mục romfs) hay không
              FOUND_ROMFS=$(find game/extracted_temp/current -type d -iname "romfs" | head -n 1)
              if [ -n "$FOUND_ROMFS" ]; then
                echo "  -> Phát hiện thư mục romfs (Mod/Việt hóa) trong $(basename "$archive"). Đang tích hợp vào game/romfs/..."
                mkdir -p game/romfs
                cp -R "$FOUND_ROMFS"/* game/romfs/
              elif [ -z "$FOUND_ROMS" ]; then
                # Nếu không chứa ROM và không có thư mục tên 'romfs', nhưng có file bên trong thì xem như Mod/Việt hóa
                FILE_COUNT=$(find game/extracted_temp/current -type f | wc -l)
                if [ "$FILE_COUNT" -gt 0 ]; then
                  echo "  -> File nén $(basename "$archive") không chứa ROM. Đang tích hợp làm Mod/Việt hóa vào game/romfs/..."
                  mkdir -p game/romfs
                  cp -R game/extracted_temp/current/* game/romfs/
                fi
              fi

              rm -rf game/extracted_temp/current
              rm -f "$archive"
            fi
          done
          rm -rf game/extracted_temp

          # Liệt kê và kiểm tra các file ROM tìm thấy
          echo "===================================================="
          echo "Danh sách các file ROM hợp lệ trong thư mục game/:"
          
          TOTAL_SIZE=0
          COUNT=0
          while IFS= read -r rf; do
            [ -z "$rf" ] && continue
            FSIZE=$(stat -f%z "$rf" 2>/dev/null || stat -c%s "$rf" 2>/dev/null || echo 0)
            echo "  + $(basename "$rf") ($FSIZE bytes)"
            TOTAL_SIZE=$((TOTAL_SIZE + FSIZE))
            COUNT=$((COUNT + 1))
          done < <(find game -maxdepth 1 -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \))

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Không tìm thấy file ROM (.nsp, .xci, .nsz, .xcz) nào trong thư mục game sau khi tải và giải nén!"
            ls -la game/
            exit 1
          fi

          echo "Tổng số file ROM: $COUNT | Tổng dung lượng: $TOTAL_SIZE bytes"

          if [ "$TOTAL_SIZE" -lt 10000000 ]; then
            echo "::error::Tổng kích thước file quá nhỏ ($TOTAL_SIZE bytes). Có thể link tải bị lỗi hoặc chưa cấp quyền truy cập liên kết!"
            exit 1
          fi

      - name: Tải và chuẩn bị file Mod / Việt hóa (nếu có link riêng)
        if: "${{ inputs.mod_download_url != '' }}"
        run: |
          MOD_URL="${{ inputs.mod_download_url }}"
          mkdir -p game/mod_temp
          echo "Bắt đầu tải file mod từ: $MOD_URL"
          if [[ "$MOD_URL" == *"drive.google.com"* ]]; then
            echo "Phát hiện link Google Drive. Đang tải mod qua gdown..."
            python3 -m gdown "$MOD_URL" -O game/mod_temp/mod.zip
          else
            echo "Đang tải mod qua curl..."
            curl -L -o game/mod_temp/mod.zip "$MOD_URL"
          fi

          if [ -f game/mod_temp/mod.zip ]; then
            echo "Đang giải nén mod..."
            mkdir -p game/romfs
            unzip -q -o game/mod_temp/mod.zip -d game/mod_temp/extracted
            FOUND_ROMFS=$(find game/mod_temp/extracted -type d -iname "romfs" | head -n 1)
            if [ -n "$FOUND_ROMFS" ]; then
              echo "Đã tự động tìm thấy thư mục romfs tại: $FOUND_ROMFS"
              cp -R "$FOUND_ROMFS"/* game/romfs/
            else
              echo "Không có thư mục romfs lồng nhau, sao chép toàn bộ nội dung..."
              cp -R game/mod_temp/extracted/* game/romfs/
            fi
            rm -rf game/mod_temp
          else
            echo "::warning::Không tìm thấy file mod sau khi tải, bỏ qua bước áp dụng mod."
          fi

      - name: Kiểm tra trạng thái Mod / Việt hóa
        run: |
          if [ -d "game/romfs" ] && [ "$(ls -A game/romfs 2>/dev/null)" ]; then
            echo "===================================================="
            echo "Đã cấu hình Mod / Việt hóa trong game/romfs:"
            ls -la game/romfs/
            echo "===================================================="
          else
            echo "Không phát hiện Mod / Việt hóa nào."
          fi

      - name: Đóng gói IPA (build_ipa_from_nsp.py)
        run: |
          python3 scripts/build_ipa_from_nsp.py game -k game/prod.keys --no-keep-extracted

      - name: Xác định tên Artifact IPA
        if: success()
        run: |
          IPA_PATH=$(find game -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            IPA_BASE=$(basename "$IPA_PATH" .ipa)
            echo "ARTIFACT_NAME=${IPA_BASE}" >> $GITHUB_ENV
            echo "Tên artifact sẽ là: ${IPA_BASE}"
          else
            echo "ARTIFACT_NAME=Game-IPA" >> $GITHUB_ENV
          fi

      - name: Upload file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.ARTIFACT_NAME || 'Game-IPA' }}
          path: game/*.ipa
          retention-days: 7

      - name: Upload logs nếu build thất bại
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-logs
          path: |
            game/*_build/logs/
            game/*_survey/logs/
          retention-days: 7
