name: Build Game IPA

on:
  workflow_dispatch:
    inputs:
      game_download_url:
        description: 'Link tải Game gốc / Base Game (hoặc file ZIP gộp cả Base/Update/DLC)'
        required: true
        type: string
        default: 'https://drive.google.com/file/d/1D527vQTykL4WggIbWdGEbttQlxyR2Ua5/view?usp=sharing'
      game_file_name:
        description: 'Tên file Base (Tùy chọn: để trống để tự động lấy tên file gốc)'
        required: false
        type: string
        default: ''
      update_download_url:
        description: 'Link tải Update (Tùy chọn: file .nsp/.nsz hoặc .zip)'
        required: false
        type: string
        default: ''
      update_file_name:
        description: 'Tên file Update (Tùy chọn)'
        required: false
        type: string
        default: ''
      dlc_download_url:
        description: 'Link tải DLC (Tùy chọn: file .nsp/.nsz hoặc file .zip chứa DLC Pack)'
        required: false
        type: string
        default: ''
      dlc_file_name:
        description: 'Tên file DLC (Tùy chọn)'
        required: false
        type: string
        default: ''
      mod_download_url:
        description: 'Link file zip Mod/Việt hóa (Google Drive hoặc URL - Tùy chọn)'
        required: false
        type: string
        default: ''

env:
  DEFAULT_URL: 'https://drive.google.com/file/d/1D527vQTykL4WggIbWdGEbttQlxyR2Ua5/view?usp=sharing'
  DEFAULT_FILE: 'Crayon Shin-chan [01005F0017566000].xci'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Thiết lập Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cài đặt công cụ hệ thống & thư viện
        run: |
          command -v xcodegen || brew install xcodegen
          brew install zstd spirv-cross glslang p7zip || brew install sevenzip || true
          command -v dotnet || brew install --cask dotnet-sdk || true
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 capstone fonttools nsz gdown "backports.zstd; python_version < '3.14'"

      - name: Thiết lập biến môi trường .NET
        run: |
          DOTNET_BIN=$(which dotnet)
          REAL_DOTNET=$(python3 -c "import os, sys; print(os.path.dirname(os.path.realpath(sys.argv[1])))" "$DOTNET_BIN")
          echo "Tìm thấy .NET tại: $REAL_DOTNET"
          echo "DOTNET_ROOT=$REAL_DOTNET" >> $GITHUB_ENV
          echo "DOTNET_ROOT_ARM64=$REAL_DOTNET" >> $GITHUB_ENV
          sudo mkdir -p /etc/dotnet
          echo "$REAL_DOTNET" | sudo tee /etc/dotnet/install_location_arm64 /etc/dotnet/install_location

      - name: Kiểm tra file prod.keys
        run: |
          if [ ! -f game/prod.keys ]; then
            echo "::error::Không tìm thấy file game/prod.keys trong repository!"
            exit 1
          fi
          echo "Đã tìm thấy game/prod.keys (kích thước: $(wc -c < game/prod.keys) bytes)"

      - name: Tải file game, update và DLC về runner
        run: |
          mkdir -p game

          # Hàm tải file dùng chung (hỗ trợ Google Drive & Direct URL)
          download_asset() {
            local url="$1"
            local name="$2"
            local desc="$3"
            local fallback_file="$4"

            if [ -z "$url" ]; then
              return 0
            fi

            echo "===================================================="
            echo "Bắt đầu tải $desc từ: $url"
            if [[ "$url" == *"drive.google.com"* ]]; then
              echo "Phát hiện link Google Drive. Đang tải qua gdown..."
              if [ -n "$name" ]; then
                python3 -m gdown "$url" -O "game/$name"
              else
                python3 -m gdown "$url" -O game/
              fi
            else
              echo "Đang tải qua curl..."
              if [ -n "$name" ]; then
                curl -L -o "game/$name" "$url"
              else
                curl -L -O -J --output-dir game "$url" || ( [ -n "$fallback_file" ] && curl -L -o "game/$fallback_file" "$url" )
              fi
            fi
          }

          # Tải Game gốc (Base)
          download_asset "${{ inputs.game_download_url || env.DEFAULT_URL }}" "${{ inputs.game_file_name }}" "Base Game" "${{ env.DEFAULT_FILE }}"

          # Tải Update (nếu có)
          download_asset "${{ inputs.update_download_url }}" "${{ inputs.update_file_name }}" "Update" ""

          # Tải DLC (nếu có)
          download_asset "${{ inputs.dlc_download_url }}" "${{ inputs.dlc_file_name }}" "DLC" ""

          # Kiểm tra và giải nén tự động nếu tải về file nén (.zip, .7z, .rar, .tar.gz)
          echo "----------------------------------------------------"
          echo "Kiểm tra các file nén trong thư mục game/..."
          mkdir -p game/extracted_temp
          for archive in game/*.zip game/*.7z game/*.rar game/*.tar.gz; do
            if [ -f "$archive" ]; then
              echo "Phát hiện file nén: $archive. Đang tiến hành giải nén..."
              if [[ "$archive" == *.zip ]]; then
                unzip -q -o "$archive" -d game/extracted_temp/
              elif command -v 7z >/dev/null 2>&1; then
                7z x -y "$archive" -ogame/extracted_temp/
              elif command -v 7za >/dev/null 2>&1; then
                7za x -y "$archive" -ogame/extracted_temp/
              else
                echo "::warning::Không tìm thấy công cụ giải nén phù hợp cho $archive"
              fi
              rm -f "$archive"
            fi
          done

          # Đưa tất cả file ROM được giải nén ra thư mục gốc game/
          if [ -d "game/extracted_temp" ]; then
            find game/extracted_temp -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \) -exec mv -v {} game/ \;
            rm -rf game/extracted_temp
          fi

          # Di chuyển bất kỳ file ROM nào nằm trong thư mục con ra thẳng thư mục game/
          find game -mindepth 2 -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \) -exec mv -v {} game/ \; 2>/dev/null || true

          # Liệt kê và kiểm tra các file ROM tìm thấy
          echo "===================================================="
          echo "Danh sách các file ROM hợp lệ trong thư mục game/:"
          ROM_FILES=$(find game -maxdepth 1 -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \))
          if [ -z "$ROM_FILES" ]; then
            echo "::error::Không tìm thấy file ROM (.nsp, .xci, .nsz, .xcz) nào trong thư mục game sau khi tải và giải nén!"
            ls -la game/
            exit 1
          fi

          TOTAL_SIZE=0
          for rf in $ROM_FILES; do
            FSIZE=$(stat -f%z "$rf" 2>/dev/null || stat -c%s "$rf" 2>/dev/null || echo 0)
            echo "  + $(basename "$rf") ($FSIZE bytes)"
            TOTAL_SIZE=$((TOTAL_SIZE + FSIZE))
          done
          echo "Tổng dung lượng ROM: $TOTAL_SIZE bytes"

          if [ "$TOTAL_SIZE" -lt 10000000 ]; then
            echo "::error::Tổng kích thước file quá nhỏ ($TOTAL_SIZE bytes). Có thể link Google Drive chưa bật quyền chia sẻ (Bất kỳ ai có liên kết) hoặc link tải bị lỗi!"
            head -n 20 $ROM_FILES 2>/dev/null || true
            exit 1
          fi

      - name: Tải và chuẩn bị file Mod / Việt hóa (nếu có)
        if: "${{ inputs.mod_download_url != '' }}"
        run: |
          MOD_URL="${{ inputs.mod_download_url }}"
          mkdir -p game/mod_temp
          echo "Bắt đầu tải file mod từ: $MOD_URL"
          if [[ "$MOD_URL" == *"drive.google.com"* ]]; then
            echo "Phát hiện link Google Drive. Đang tải mod qua gdown..."
            python3 -m gdown "$MOD_URL" -O game/mod_temp/mod.zip
          else
            echo "Đang tải mod qua curl..."
            curl -L -o game/mod_temp/mod.zip "$MOD_URL"
          fi

          if [ -f game/mod_temp/mod.zip ]; then
            echo "Đang giải nén mod..."
            mkdir -p game/romfs
            unzip -q -o game/mod_temp/mod.zip -d game/mod_temp/extracted
            # Tự động tìm thư mục romfs ở bất kỳ cấp độ nào bên trong file zip
            FOUND_ROMFS=$(find game/mod_temp/extracted -type d -iname "romfs" | head -n 1)
            if [ -n "$FOUND_ROMFS" ]; then
              echo "Đã tự động tìm thấy thư mục romfs tại: $FOUND_ROMFS"
              cp -R "$FOUND_ROMFS"/* game/romfs/
            else
              echo "Không có thư mục romfs lồng nhau, sao chép toàn bộ nội dung..."
              cp -R game/mod_temp/extracted/* game/romfs/
            fi
            echo "Đã chuẩn bị xong thư mục mod tại game/romfs:"
            ls -la game/romfs/
            rm -rf game/mod_temp
          else
            echo "::warning::Không tìm thấy file mod sau khi tải, bỏ qua bước áp dụng mod."
          fi

      - name: Đóng gói IPA (build_ipa_from_nsp.py)
        run: |
          python3 scripts/build_ipa_from_nsp.py game -k game/prod.keys --no-keep-extracted

      - name: Xác định tên Artifact IPA
        if: success()
        run: |
          IPA_PATH=$(find game -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            IPA_BASE=$(basename "$IPA_PATH" .ipa)
            echo "ARTIFACT_NAME=${IPA_BASE}" >> $GITHUB_ENV
            echo "Tên artifact sẽ là: ${IPA_BASE}"
          else
            echo "ARTIFACT_NAME=Game-IPA" >> $GITHUB_ENV
          fi

      - name: Upload file IPA lên Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.ARTIFACT_NAME || 'Game-IPA' }}
          path: game/*.ipa
          retention-days: 7

      - name: Upload logs nếu build thất bại
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-logs
          path: |
            game/*_build/logs/
            game/*_survey/logs/
          retention-days: 7
